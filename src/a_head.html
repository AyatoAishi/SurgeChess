<meta charset="utf-8">
<title>Surge Chess</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Schibsted+Grotesk:wght@400;600;700&family=Noto+Sans+Symbols+2&display=swap">
<style>
/* Layout: single dark game table. Menu = brand + two mode cards + powerup legend; game = board with side panel (stacked on phones). */
:root{
  --bg:#0e1621; --panel:#162131; --panel2:#1c2a3f; --line:#2a3a54;
  --fg:#e9eef6; --muted:#97a7bf;
  --sql:#cfd9e6; --sqd:#6b87a7;
  --y:#ffcf33; --r:#ff5468; --g:#3fdc8a;
  --wp:#f7f2e7; --bp:#141923;
  --fd:'Unbounded','Arial Black',system-ui,sans-serif;
  --fb:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --fc:'Noto Sans Symbols 2','Segoe UI Symbol','Apple Symbols','DejaVu Sans',serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--fb);font-size:15px;line-height:1.45;
  padding-block:22px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid #8ab4ff;outline-offset:2px}

/* orbs (shared by legend, board, toast) */
.orb{display:inline-grid;place-items:center;border-radius:50%;color:#161000;flex:none}
.orb svg{width:58%;height:58%}
.orb.y,.pw.y{background:radial-gradient(circle at 35% 30%,#fff5b8,var(--y) 55%,#c79a00)}
.orb.r,.pw.r{background:radial-gradient(circle at 35% 30%,#ffc2ca,var(--r) 55%,#c01d33);color:#fff}
.orb.m,.pw.m{background:radial-gradient(circle at 35% 30%,#fff0b0,#d9a21b 55%,#7a5200);color:#2a1800}
.orb.b,.pw.b{background:radial-gradient(circle at 35% 30%,#fff0b0,#e0a020 55%,#8a5a00);color:#2a1800}
.orb.t,.pw.t{background:radial-gradient(circle at 35% 30%,#e0e6f2,#7f8aa6 55%,#3d4660);color:#fff}
.orb.i,.pw.i{background:radial-gradient(circle at 35% 30%,#f0e0ff,#a070e0 55%,#5a2aa0);color:#fff}
.orb.g,.pw.g{background:radial-gradient(circle at 35% 30%,#c8ffe2,var(--g) 55%,#13a35c);color:#05220f}

/* menu */
.menu{max-width:1040px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px 28px;align-items:start}
.brand{grid-column:1/-1;display:flex;flex-direction:column;gap:14px;padding-block:8px 6px}
.kicker{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
.kicker .orb{width:16px;height:16px}
.kicker .orb svg{width:62%;height:62%}
h1{font-family:var(--fd);font-weight:800;font-size:clamp(38px,8vw,76px);line-height:.98;letter-spacing:-.03em;text-wrap:balance}
.tag{margin:0;color:var(--muted);max-width:58ch;font-size:16px}
.modes{display:grid;gap:14px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.card h2{font-family:var(--fd);font-weight:600;font-size:16px;margin-bottom:6px}
.card h3{font-family:var(--fd);font-weight:600;font-size:13px;letter-spacing:.02em;margin-bottom:10px}
.card p{margin:0 0 14px;color:var(--muted)}
.field{margin:0 0 14px;border:0;padding:0;min-width:0}
.field legend{padding:0;margin-bottom:6px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 0;min-width:76px;padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-weight:600}
.seg button[aria-pressed="true"]{background:#e9eef6;color:#0e1621;border-color:#e9eef6}
.btn{border-radius:10px;border:1px solid var(--line);background:var(--panel2);padding:11px 16px;font-weight:700;cursor:pointer}
.btn:hover{border-color:#5a76a0}
.btn.primary{background:var(--y);border-color:transparent;color:#1a1400}
.btn.primary:hover{background:#ffd957}
.card .btn.primary{width:100%}

/* legend */
.legend{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.legend li{display:flex;gap:12px;align-items:flex-start}
.legend .orb{width:34px;height:34px;margin-top:2px}
.legend strong{display:block;font-size:14px}
.legend span.d{display:block;color:var(--muted);font-size:13.5px}
.fine{margin:12px 0 0;color:var(--muted);font-size:12.5px}
.card p.fine{margin:12px 0 0}

/* game layout */
.gwrap{max-width:1040px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.stage{min-width:0;display:grid;gap:12px;align-content:start}
.bar{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between;width:min(100%,700px);margin-inline:auto}
.turn{display:flex;align-items:center;gap:10px;font-weight:700;min-width:0}
.turn em{font-style:normal;color:var(--r);font-weight:700}
.tdot{width:14px;height:14px;border-radius:50%;border:2px solid #fff;flex:none}
.tdot.w{background:var(--wp);border-color:#222c3d}
.tdot.b{background:var(--bp);border-color:#aab7cb}
.surge{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;font-weight:600}
.pips{display:flex;gap:4px}
.pips i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.pips i.on{background:var(--y)}
.boardwrap{position:relative;width:min(100%,700px,max(320px,100svh - 150px));margin-inline:auto}
.board{container-type:inline-size;width:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));grid-template-rows:repeat(10,minmax(0,1fr));border-radius:8px;overflow:hidden;box-shadow:0 0 0 3px #223049,0 18px 40px rgba(0,0,0,.45)}
.sq{position:relative;display:grid;place-items:center;border:0;padding:0;margin:0;cursor:pointer;min-width:0;min-height:0}
.lookseg{grid-column:1/-1;width:100%;flex-wrap:nowrap}.lookseg button{min-width:0;padding:9px 6px;font-size:13px}
.pc.nm{text-transform:capitalize;display:block;width:92%;height:auto;font-family:var(--fb,inherit);font-weight:700;font-size:1.75cqw;letter-spacing:.02em;text-align:center;padding:.5cqw .2cqw;border-radius:1cqw;-webkit-text-stroke:0;box-shadow:0 .5cqw 0 rgba(0,0,0,.3)}
.pc.nm.w{background:#efe6cf;color:#1b2332;border:.25cqw solid #b2a47c}
.pc.nm.b{background:#161921;color:#f0cfd4;border:.25cqw solid #c2203a}
.uprev .pc.nm,.promos .pc.nm{font-size:9px;width:94%;box-sizing:border-box;overflow:hidden;padding:3px 1px;border-radius:5px}
.sq.l{background:var(--sql)}
.sq.d{background:var(--sqd)}
.sq.l,.sq.d{box-shadow:inset 0 .35cqw 0 rgba(255,255,255,.22),inset 0 -.5cqw 0 rgba(0,0,0,.28),inset .3cqw 0 0 rgba(255,255,255,.08),inset -.3cqw 0 0 rgba(0,0,0,.12)}
.sq.sel{box-shadow:inset 0 0 0 .55cqw #fff!important}
.sq.last{background-image:linear-gradient(rgba(255,214,102,.42),rgba(255,214,102,.42))}
.sq.chk{background-image:radial-gradient(circle,rgba(255,84,104,.95),rgba(255,84,104,0) 72%)}
.sq.sel{box-shadow:inset 0 0 0 .55cqw #fff}
.sq.dot::after{content:"";position:absolute;top:36%;left:36%;width:28%;height:28%;border-radius:50%;background:rgba(14,22,33,.38);z-index:3;pointer-events:none}
.sq.cap::after{content:"";position:absolute;inset:5%;border-radius:50%;border:.9cqw solid rgba(14,22,33,.42);z-index:3;pointer-events:none}
.co{position:absolute;font-style:normal;font-weight:700;font-size:max(9px,1.6cqw);line-height:1;pointer-events:none;z-index:1}
.co.rk{left:5%;top:5%}
.co.f{right:5%;bottom:4%}
.sq.l .co{color:var(--sqd)}
.sq.d .co{color:var(--sql)}
.pc{position:relative;z-index:2;font-family:var(--fc);font-size:7.7cqw;line-height:1;pointer-events:none;paint-order:stroke fill}
.pc.w{color:var(--wp);-webkit-text-stroke:.24cqw #1b2332}
.pc.b{color:var(--bp);-webkit-text-stroke:.14cqw #c3cedf}
.pc.aura{filter:drop-shadow(0 0 .3cqw var(--y)) drop-shadow(0 0 1.5cqw rgba(255,207,51,.9));animation:glow 1.8s ease-in-out infinite}
.sq.hasaura::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(255,207,51,.45),rgba(255,207,51,0) 68%);pointer-events:none}
.pw{position:absolute;top:27%;left:27%;z-index:1;width:46%;height:46%;border-radius:50%;display:grid;place-items:center;pointer-events:none;box-shadow:0 0 0 .4cqw rgba(255,255,255,.55),0 .6cqw 1.6cqw rgba(0,0,0,.35)}
.pw svg{width:58%;height:58%}
.pw.r{color:#fff}
.pw::after{content:"";position:absolute;inset:-6%;border-radius:50%;border:.5cqw solid currentColor;opacity:0;animation:ring 2s ease-out infinite}
.pw.y::after{color:var(--y)}.pw.g::after{color:var(--g)}.pw.r::after{color:var(--r)}
.pw.under{width:24%;height:24%;right:5%;top:5%;left:auto;z-index:3}
.pw.fresh{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.pc.fresh{animation:pop .55s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.1);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes ring{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.5);opacity:0}}
@keyframes glow{50%{filter:drop-shadow(0 0 .3cqw var(--y)) drop-shadow(0 0 2.4cqw rgba(255,207,51,1))}}
@media (prefers-reduced-motion:reduce){.pw::after,.pc.aura{animation:none}.pw.fresh,.pc.fresh{animation:none}}

.toast{position:absolute;left:50%;top:10px;z-index:15;max-width:92%;transform:translate(-50%,-10px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  background:#0b121c;border:1px solid var(--line);border-left:5px solid var(--muted);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.n{border-left-color:#8ab4ff}
.toast.y{border-left-color:var(--y)}.toast.r{border-left-color:var(--r)}.toast.g{border-left-color:var(--g)}

.overlay{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:rgba(9,14,22,.74);border-radius:8px;padding:12px}
.simt{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0 10px}.simt th,.simt td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left}.simt th{color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase}#simOut h3{margin:14px 0 4px;font-size:14px}
.recap{text-align:left;font-size:13px;max-height:46vh;overflow:auto}.recap table{width:100%;border-collapse:collapse}.recap td,.recap th{padding:4px 6px;border-bottom:1px solid var(--line)}.recap th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;text-align:left}.recap .tp{margin-top:8px;color:var(--y)}
.ovc{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;text-align:center;max-width:440px;width:100%;display:grid;gap:12px}
.ovc h2{font-family:var(--fd);font-size:22px}
.ovc p{margin:0;color:var(--muted)}
.ovc .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.promos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.promos button{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--sqd);cursor:pointer;font-family:var(--fc);font-size:38px;line-height:1;padding:0}
.promos button:hover{background:var(--sql)}
.promos .pc{font-size:40px;-webkit-text-stroke-width:1px}
.promos .pc.b{-webkit-text-stroke-width:.6px}

.side{display:grid;gap:14px;align-content:start;min-width:0}
.log{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13.5px;max-height:240px;overflow:auto}
.log li{display:flex;gap:8px;align-items:baseline;color:var(--muted)}
.log li:first-child{color:var(--fg)}
.log li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--line);transform:translateY(-1px)}
.log li.y::before{background:var(--y)}.log li.r::before{background:var(--r)}.log li.g::before{background:var(--g)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.actions .btn{flex:1 1 auto}

/* sprite pieces */
.pc.has{width:100%;height:100%;display:block;font-size:0;-webkit-text-stroke:0}
.spr{display:block;width:100%;height:100%;background:center/contain no-repeat;filter:drop-shadow(0 .5cqw .5cqw rgba(0,0,0,.38))}
.promos .pc.has,.uprev .pc.has{width:100%;height:100%}
.promos button{padding:2px}
.uprev{width:54px;height:54px}
/* fx layers */
.fxc{position:fixed;left:0;top:0;pointer-events:none}
.fxc.back{z-index:0}
.fxc.front{z-index:40}
#app{position:relative;z-index:1}
.vig{position:fixed;inset:0;z-index:45;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(255,40,60,0) 35%,rgba(190,10,35,.85) 100%)}
.fxlayer{position:absolute;inset:0;z-index:12;pointer-events:none;container-type:inline-size}
.ghost,.fly,.fxs,.scorch{position:absolute;width:10%;height:10%;display:grid;place-items:center;pointer-events:none}
.ghost{z-index:1}.fly{z-index:3}.fxs{z-index:4}.scorch{z-index:0}
.fly .pc,.ghost .pc{position:relative}
.sl{position:absolute;left:50%;top:50%;width:260%;height:7%;margin:-3.5% 0 0 -130%;border-radius:99px;background:linear-gradient(90deg,rgba(255,45,79,0),#ff2d4f 22%,#fff 50%,#ff2d4f 78%,rgba(255,45,79,0));filter:drop-shadow(0 0 .9cqw #ff2d4f)}
.scorch{background:radial-gradient(circle,rgba(0,0,0,.75),rgba(60,20,0,.55) 45%,rgba(255,120,30,0) 72%);border-radius:50%;transform:scale(1.5)}
.pc.hide{visibility:hidden}
.pc.fallen{transform:rotate(82deg) translate(6%,8%);opacity:.72;filter:grayscale(.7);transition:transform .8s cubic-bezier(.5,0,.8,.6),opacity .8s,filter .8s}
.pc .bdg{position:absolute;right:-12%;bottom:-4%;font-size:.46em;line-height:1;padding:.1em .16em;border-radius:50%;background:#18202e;color:#f7f2e7;border:.1em solid #ff9a6b;-webkit-text-stroke:0;font-family:var(--fc)}
.pc .bdg.C{border-color:#b98aff}
.uprev{display:grid;place-items:center;width:46px;height:46px;border-radius:10px;background:var(--sqd);flex:none}
.uprev .pc{font-size:30px;-webkit-text-stroke-width:1px}

@media (min-width:900px){
  .gwrap{grid-template-columns:minmax(0,700px) minmax(260px,1fr);gap:26px;align-items:start}
  .stage .bar{margin-inline:0}
  .boardwrap{margin-inline:0}
}
@media (max-width:760px){
  .menu{grid-template-columns:minmax(0,1fr)}
}

.hcard{position:absolute;z-index:30;width:min(330px,92%);box-sizing:border-box;background:rgba(12,19,33,.96);border:1px solid #33466a;border-radius:14px;padding:12px;box-shadow:0 14px 40px rgba(0,0,0,.55);pointer-events:none;color:#e9eefb}
.hcard[hidden]{display:none}
@keyframes hcin{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}
.hc-top{display:flex;gap:12px;align-items:flex-start}
.hc-img{flex:0 0 92px;height:92px;border:2px solid #cdd7ee;border-radius:6px;background:radial-gradient(circle at 50% 40%,#2b3d62,#121b2d);display:grid;place-items:center;overflow:hidden}
.pimg{width:100%;height:100%;object-fit:contain;display:block}
.hc-txt h4{margin:0 0 4px;font-size:18px;display:flex;align-items:baseline;gap:8px}.hc-txt h4 small{font-size:11px;font-weight:600;color:#9fb0d0;text-transform:uppercase;letter-spacing:.06em}
.hc-txt p{margin:0;font-size:13px;line-height:1.4;color:#c9d4ea}
.hc-buffs{margin-top:10px;padding-top:9px;border-top:1px solid #2a3a58}.hc-buffs h5{margin:0 0 5px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#9fb0d0}
.hc-buffs ul{margin:0;padding:0;list-style:none;display:grid;gap:5px}.hc-buffs li{font-size:12.5px;line-height:1.35;color:#c9d4ea;padding-left:10px;border-left:3px solid #ffd45e}
.hc-buffs li b{color:#fff}.hc-buffs li.r{border-color:#ff5468}.hc-buffs li.g{border-color:#3fdc8a}.hc-buffs li.b{border-color:#7fb4ff}.hc-none{font-size:12.5px;color:#7f8fb0}

.streak{position:absolute;left:50%;top:13%;transform:translate(-50%,-14px) scale(.9);z-index:25;pointer-events:none;opacity:0;font-weight:800;font-size:clamp(20px,3.6vw,34px);letter-spacing:.06em;text-transform:uppercase;white-space:normal;text-align:center;max-width:92%;width:max-content;padding:6px 18px;border-radius:12px;background:linear-gradient(90deg,transparent,rgba(10,14,24,.78) 20%,rgba(10,14,24,.78) 80%,transparent);transition:opacity .25s,transform .35s cubic-bezier(.2,1.5,.4,1)}
.streak.show{opacity:1;transform:translate(-50%,0) scale(1)}
.streak.warm{color:#ffb347;text-shadow:0 0 16px #ff7a1a}.streak.hot{color:#ff8a3d;text-shadow:0 0 20px #ff3a12,0 0 40px #ff5a1a}
.streak.blue{color:#bfe0ff;text-shadow:0 0 18px #4f9bff,0 0 40px #3a7bff}.streak.cold{color:#aebbd6;font-size:clamp(14px,2.2vw,20px);text-shadow:none}
.streak.check{color:#ff6b7a;text-shadow:0 0 18px #ff2a45,0 0 40px #ff1a3a}

#vsOv{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;overflow:hidden;cursor:pointer;transition:opacity .45s}
#vsOv[hidden]{display:none}#vsOv.out{opacity:0}
#vsOv .vsbg{position:absolute;inset:0;background:radial-gradient(ellipse at center,var(--vs1,#2a1208) 0%,var(--vs2,#0a0605) 75%)}
#vsOv .vsbg::after{content:"";position:absolute;inset:-20%;background:repeating-linear-gradient(115deg,transparent 0 40px,rgba(255,255,255,.035) 40px 44px);animation:vsSlide 3s linear infinite}
@keyframes vsSlide{to{transform:translateX(88px)}}
.vswrap{position:relative;display:flex;align-items:center;justify-content:center;gap:clamp(12px,4vw,56px);width:100%;max-width:980px;padding:0 16px}
.vsside{flex:1;padding:22px 10px;text-align:center;border-top:3px solid currentColor;border-bottom:3px solid currentColor;background:rgba(0,0,0,.45);animation:vsInL .55s cubic-bezier(.2,1.2,.3,1) both}
.vsside small{display:block;letter-spacing:.4em;font-size:11px;opacity:.7}
.vsside b{font-size:clamp(28px,7vw,64px);letter-spacing:.12em;font-weight:900}
.vsL{color:#f2efe6}.vsR{color:#ff6b7d;animation-name:vsInR}
@keyframes vsInL{from{transform:translateX(-120vw) skewX(-14deg)}to{transform:none}}
@keyframes vsInR{from{transform:translateX(120vw) skewX(14deg)}to{transform:none}}
.vsvs{font-size:clamp(46px,12vw,120px);font-weight:900;font-style:italic;color:#ffd666;text-shadow:0 0 30px #ff8a30,0 0 70px #ff5a20,4px 4px 0 #000;animation:vsSlam .5s .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes vsSlam{from{transform:scale(6) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
.vsenv{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;animation:vsUp .6s 1s both}
@keyframes vsUp{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.vsenv span{font-size:54px;filter:drop-shadow(0 0 18px var(--vsc,#ff8a30))}
.vsenv b{font-size:clamp(24px,5vw,44px);letter-spacing:.3em;color:var(--vsc,#ff8a30);text-shadow:0 0 24px var(--vsc,#ff8a30)}
.vsenv em{font-style:normal;max-width:620px;padding:0 18px;color:#e8e2d4;opacity:.9;font-size:14px;line-height:1.5}

.cine{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.cine .vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 42%,rgba(0,0,0,.78) 100%);opacity:0;transition:opacity .4s}
.cine.on .vig{opacity:1}.cine.long .vig{background:radial-gradient(ellipse at center,transparent 36%,rgba(10,0,6,.88) 100%)}
.cine .bar{position:absolute;left:0;right:0;height:0;background:#000;transition:height .38s cubic-bezier(.2,.8,.2,1)}
